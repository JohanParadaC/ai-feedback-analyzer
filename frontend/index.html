<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Analiza el feedback de tus clientes con IA: sentimiento, NPS, quejas recurrentes y respuestas automáticas." />
    <meta name="theme-color" content="#4f46e5" />
    <title>Intelligence Hub · AI Feedback Analyzer</title>

    <script>
      // Aplicamos el tema antes de pintar para evitar el destello blanco
      // que se ve si el modo oscuro se activa ya montada la app.
      (function () {
        try {
          var stored = localStorage.getItem('hub_theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) { /* localStorage bloqueado: seguimos en claro */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
