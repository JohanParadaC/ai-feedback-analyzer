name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Si se empujan varios commits seguidos a la misma rama, cancela las
# ejecuciones anteriores en vez de gastar minutos en código ya superado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Comprobación de tipos
        run: npm run typecheck

      - name: Build
        run: npm run build

  frontend:
    name: Frontend · lint y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Build
        run: npm run build

  secrets:
    name: Revisión de secretos
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que no se ha subido ningún .env
        run: |
          # `.env.example` sí debe estar; cualquier otro .env es un secreto filtrado.
          encontrados=$(git ls-files | grep -E '(^|/)\.env' | grep -v '\.env\.example$' || true)
          if [ -n "$encontrados" ]; then
            echo "::error::Hay archivos .env versionados:"
            echo "$encontrados"
            exit 1
          fi
          echo "Ningún archivo .env versionado."
