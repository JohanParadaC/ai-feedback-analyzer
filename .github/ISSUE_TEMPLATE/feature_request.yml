name: Propuesta de funcionalidad
description: Sugiere una mejora o algo nuevo
labels: ["enhancement"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Qué problema resuelve
      description: Empieza por la necesidad, no por la solución.
      placeholder: "Cuando tengo más de 500 reseñas, no puedo saber cuáles ya he respondido…"
    validations:
      required: true

  - type: textarea
    id: propuesta
    attributes:
      label: Qué propones
    validations:
      required: true

  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas que has considerado

  - type: checkboxes
    id: participacion
    attributes:
      label: Participación
      options:
        - label: Me gustaría implementarlo yo
